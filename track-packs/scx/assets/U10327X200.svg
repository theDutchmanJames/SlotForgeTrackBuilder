<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -298 243.040151 163.900974" role="img"><title>R1 border with barrier</title><desc>Identification drawing only. Coordinates are not physical measurements. Red shoulder, red/white trackside kerb and grey wall follow the clear 2021 catalogue photograph for this same SKU. Radius-family name refers to the road; border width, angle and mounting position are unverified. 2021 lists 4+4; 2026 prints +4. Component allocation remains unresolved.</desc><defs><pattern id="scx-grain" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#424f60"/><circle cx="1.5" cy="2" r=".45" fill="#647183"/><circle cx="5" cy="5" r=".4" fill="#283643"/></pattern></defs><path d="M 0 -273 A 273 273 0 0 1 193.040151 -193.040151 L 159.099026 -159.099026 A 225 225 0 0 0 0 -225 Z" fill="#a93b45" stroke="#c0c5c7" stroke-width="0.8" /><path d="M 0 -234 A 234 234 0 0 1 165.462987,-165.462987" fill="none" stroke="#ededdf" stroke-width="15" /><path d="M 0 -234 A 234 234 0 0 1 165.462987,-165.462987" fill="none" stroke="#d73940" stroke-width="15" stroke-dasharray="14 14"/><path d="M 0 -270 A 270 270 0 0 1 190.918831,-190.918831" fill="none" stroke="#5a636e" stroke-width="7" /><path d="M 0 -270 A 270 270 0 0 1 190.918831,-190.918831" fill="none" stroke="#c4c8c9" stroke-width="4" /></svg>