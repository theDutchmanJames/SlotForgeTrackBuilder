<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 230 98" role="img"><title>180 mm straight border with barrier</title><desc>Identification drawing only. Coordinates are not physical measurements. Grey shoulder, red/white kerb and grey solid wall. Published length is 180 mm; width, wall thickness and mounts are unresolved.</desc><defs><pattern id="scx-grain" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#424f60"/><circle cx="1.5" cy="2" r=".45" fill="#647183"/><circle cx="5" cy="5" r=".4" fill="#283643"/></pattern></defs><path d="M 0 0 H 180 V 48 H 0 Z" fill="#929ba3" stroke="#c0c5c7" stroke-width="0.8" /><path d="M 0 9 H 180" fill="none" stroke="#ededdf" stroke-width="15" /><path d="M 0 9 H 180" fill="none" stroke="#d73940" stroke-width="15" stroke-dasharray="14 14"/><path d="M 0 45 H 180" fill="none" stroke="#5a636e" stroke-width="7" /><path d="M 0 45 H 180" fill="none" stroke="#c4c8c9" stroke-width="4" /></svg>